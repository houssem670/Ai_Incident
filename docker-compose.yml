services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always

    ports:
      - "5678:5678"

    env_file:
      - .env

    volumes:
      - n8n_data:/home/node/.n8n
      - ./access_logs:/home/node/.n8n-files

    dns:
      - 8.8.8.8
      - 1.1.1.1

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - postgres
      - nuclei-api

    networks:
      - soc-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U n8n -d incidents"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - soc-network

  nuclei-api:
    build:
      context: ./nuclei-api

    container_name: nuclei_api
    restart: always

    ports:
      - "8001:8000"

    volumes:
      - nuclei_templates:/root/nuclei-templates

    networks:
      - soc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: soc-backend
    restart: always

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - nuclei-api

    networks:
      - soc-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: soc-frontend
    restart: always

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - soc-network

networks:
  soc-network:
    name: soc-network
    driver: bridge

volumes:
  n8n_data:
  postgres_data:
  nuclei_templates: