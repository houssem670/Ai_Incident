version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: incidents
    ports:
      - "5432:5432"
  grafana:
    image: grafana/grafana
    ports:
    - "3000:3000"
    restart: always

volumes:
  n8n_data: