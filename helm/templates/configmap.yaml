{{- if .Values.configMap.enabled }}

apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace.name }}

data:
  APP_NAME: "{{ .Values.configMap.appName }}"
  API_VERSION: "{{ .Values.configMap.apiVersion }}"
  HOST: "{{ .Values.configMap.host }}"
  PORT: "{{ .Values.configMap.port }}"
  CORS_ALLOWED_ORIGINS: "{{ .Values.configMap.corsScheme }}://{{ .Values.ingress.host }}"

{{- end }}