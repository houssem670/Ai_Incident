{{- if .Values.rbac.enabled }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: {{ .Values.rbac.role.name }}
  namespace: {{ .Values.namespace.name }}

rules:

  - apiGroups: [""]

    resources:
      - pods

    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]

    resources:
      - services

    verbs:
      - get
      - list

{{- end }}